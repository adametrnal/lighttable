name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and validate clean source in Ubuntu
        run: |
          python3 scripts/package-release.py source /tmp/lighttable-source
          docker build --target artifacts --output type=local,dest=dist/ubuntu -f /tmp/lighttable-source/packaging/Dockerfile /tmp/lighttable-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-release-candidate
          path: dist/ubuntu/
          if-no-files-found: error
          retention-days: 14
