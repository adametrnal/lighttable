[package]
name = "lighttable"
version = "0.1.0"
edition = "2024"
description = "A fast Linux companion for Lightroom Classic catalogs"
license = "MIT"
repository = "https://github.com/adametrnal/lighttable"
readme = "README.md"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
lcms2 = "6"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
trash = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
